<form id="auth-form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Введите email" autocomplete="email" required />

    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" placeholder="Введите пароль" autocomplete="current-password"
        required />

    <button type="button" data-auth-action="login">
        Войти
    </button>

    <button type="button" data-auth-action="signup">
        Зарегистрироваться
    </button>

    <button type="button" data-auth-action="reset">
        Забыли пароль?
    </button>

    <p class="form-message" role="status" aria-live="polite"></p>
</form>

<script type="module" src="./js/auth.js"></script>
